[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-blueprint-suite"
version = "0.1.0"
description = "Generate Factorio blueprints in code and test them in the real headless engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rykon_" }]
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fbs = "fbs.cli:main"

[tool.setuptools.packages.find]
include = ["fbs*"]

[tool.setuptools.package-data]
"fbs.testbench" = ["lua/*.lua"]
"fbs" = ["data/*.json"]
